<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
        <defs>
          <style>
            @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }
            .pulsing { animation: pulse 2s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
          </style>
          <linearGradient id="grad-naruto" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f97316"></stop>
            <stop offset="50%" stop-color="#22d3ee"></stop>
            <stop offset="100%" stop-color="#eab308"></stop>
          </linearGradient>
          <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f97316" stop-opacity="0.7"></stop>
            <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.3"></stop>
            <stop offset="100%" stop-color="#f472b6" stop-opacity="0.6"></stop>
          </linearGradient>
          <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"></circle>
          </pattern>
        </defs>
        <rect width="1200" height="630" fill="#0d0e16" rx="16"></rect>
        <rect width="1200" height="630" fill="url(#dots)" rx="16"></rect>
        <circle cx="200" cy="150" r="220" fill="#f97316" opacity="0.14" filter="blur(70px)"></circle>
        <circle cx="980" cy="480" r="260" fill="#22d3ee" opacity="0.12" filter="blur(80px)"></circle>
        <rect x="35" y="35" width="1130" height="560" fill="rgba(18, 20, 32, 0.82)" rx="16" stroke="url(#border-glow)" stroke-width="1.5"></rect>

        <!-- Left Content -->
        <g transform="translate(80, 85)">
          <rect x="0" y="0" width="230" height="36" fill="rgba(249, 115, 22, 0.12)" stroke="#f97316" rx="18"></rect>
          <circle cx="20" cy="18" r="5" fill="#f97316" class="pulsing"></circle>
          <text x="36" y="23" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" fill="#f97316">⚡ Open to Shinobi Collabs</text>

          <text x="0" y="85" font-family="Fira Code, monospace" font-size="18" fill="#94a3b8">Hi there, Dattebayo! I'm</text>
          <text x="0" y="145" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="44" fill="url(#grad-naruto)">Rupesh Ganesh Badgujar</text>
          <text x="0" y="190" font-family="Fira Code, monospace" font-size="17" fill="#22d3ee">&gt; Coding Head • Student Innovator • Game Strategist</text>
          <text x="0" y="240" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#94a3b8">Forging high-speed applications, clean algorithms, and ninja-grade web tools.</text>

          <!-- Meta Row -->
          <g transform="translate(0, 300)">
            <rect x="0" y="0" width="165" height="40" fill="#141724" rx="8" stroke="rgba(255,255,255,0.08)"></rect>
            <circle cx="20" cy="20" r="5" fill="#f97316"></circle>
            <text x="35" y="25" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Hyderabad, IN</text>

            <rect x="180" y="0" width="175" height="40" fill="#141724" rx="8" stroke="rgba(255,255,255,0.08)"></rect>
            <circle cx="200" cy="20" r="5" fill="#22d3ee"></circle>
            <text x="215" y="25" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#e2e8f0">School Student</text>

            <rect x="370" y="0" width="185" height="40" fill="#141724" rx="8" stroke="rgba(255,255,255,0.08)"></rect>
            <circle cx="390" cy="20" r="5" fill="#eab308"></circle>
            <text x="405" y="25" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#e2e8f0">@Rupesh1541</text>
          </g>
        </g>

        <!-- Right Camera Viewfinder -->
        <g transform="translate(730, 80)">
          <rect x="0" y="0" width="390" height="460" fill="#090a0f" rx="14" stroke="rgba(255,255,255,0.12)"></rect>
          <path d="M 18 38 L 18 18 L 38 18" fill="none" stroke="#f97316" stroke-width="2.5"></path>
          <path d="M 372 38 L 372 18 L 352 18" fill="none" stroke="#f97316" stroke-width="2.5"></path>
          <path d="M 18 422 L 18 442 L 38 442" fill="none" stroke="#f97316" stroke-width="2.5"></path>
          <path d="M 372 422 L 372 442 L 352 442" fill="none" stroke="#f97316" stroke-width="2.5"></path>

          <circle cx="38" cy="42" r="5" fill="#ef4444" class="pulsing"></circle>
          <text x="52" y="46" font-family="Fira Code, monospace" font-size="12" fill="#ef4444">REC • 60FPS</text>
          <text x="245" y="46" font-family="Fira Code, monospace" font-size="12" fill="#94a3b8">rupesh_wave.mp4</text>

          <rect x="30" y="65" width="330" height="330" fill="#121521" rx="10"></rect>
          <circle cx="195" cy="230" r="95" fill="url(#grad-naruto)" opacity="0.18">
            <animate attributeName="r" values="85;105;85" dur="3s" repeatCount="indefinite"></animate>
          </circle>
          <circle cx="195" cy="210" r="52" fill="#1e293b" stroke="#f97316" stroke-width="3"></circle>
          <rect x="150" y="175" width="90" height="18" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1"></rect>
          <circle cx="195" cy="184" r="5" fill="#f97316"></circle>
          <g transform="translate(255, 195)">
            <animateTransform attributeName="transform" type="rotate" values="-15 255 195; 20 255 195; -15 255 195" dur="1.2s" repeatCount="indefinite"></animateTransform>
            <text x="0" y="0" font-size="34">👋</text>
          </g>
          <text x="195" y="315" font-family="Fira Code, monospace" font-weight="600" font-size="14" fill="#f97316" text-anchor="middle">🍃 KONOHA CODING HEAD</text>
          <text x="195" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">SMIL Frame Loop • 4.0s Cycle</text>

          <rect x="30" y="415" width="330" height="5" fill="rgba(255,255,255,0.1)" rx="2.5"></rect>
          <rect x="30" y="415" width="100" height="5" fill="#f97316" rx="2.5">
            <animate attributeName="width" values="0;330;330;0" keyTimes="0;0.65;0.9;1" dur="4s" repeatCount="indefinite"></animate>
          </rect>
        </g>
      </svg>