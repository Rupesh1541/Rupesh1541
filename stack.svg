<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
        <rect width="1200" height="460" fill="#0d0e16" rx="16"></rect>
        <rect x="35" y="30" width="1130" height="400" fill="rgba(18, 20, 32, 0.85)" rx="16" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"></rect>

        <text x="75" y="80" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="22" fill="#ffffff">Ninjutsu Tech Arsenal — Vite &amp; Git Orbiting React</text>
        <text x="75" y="105" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8">Three tilted elliptical orbits with React carrying Vite &amp; Git moons in safe clearance</text>

        <!-- Left: Glowing Core & Orbits -->
        <g transform="translate(270, 265)">
          <ellipse cx="0" cy="0" rx="170" ry="65" fill="none" stroke="rgba(249,115,22,0.25)" stroke-width="1.5" transform="rotate(-15)"></ellipse>
          <ellipse cx="0" cy="0" rx="150" ry="55" fill="none" stroke="rgba(34,211,238,0.25)" stroke-width="1.5" transform="rotate(28)"></ellipse>
          <ellipse cx="0" cy="0" rx="115" ry="42" fill="none" stroke="rgba(167,139,250,0.25)" stroke-width="1.5" transform="rotate(-48)"></ellipse>

          <circle cx="0" cy="0" r="34" fill="#f97316" opacity="0.25"></circle>
          <circle cx="0" cy="0" r="22" fill="#141724" stroke="#f97316" stroke-width="2"></circle>
          <text x="0" y="5" font-family="Fira Code, monospace" font-weight="700" font-size="11" fill="#f97316" text-anchor="middle">CORE</text>

          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"></animateTransform>
            <g transform="translate(135, 0)">
              <circle cx="0" cy="0" r="18" fill="#090a0f" stroke="#22d3ee" stroke-width="2"></circle>
              <text x="0" y="5" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#22d3ee" text-anchor="middle">⚛</text>
              <g>
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.2s" repeatCount="indefinite"></animateTransform>
                <circle cx="0" cy="0" r="34" fill="none" stroke="rgba(255,255,255,0.12)" stroke-dasharray="3 3"></circle>
                <circle cx="34" cy="0" r="10" fill="#eab308"></circle>
                <text x="34" y="3.5" font-family="Fira Code, monospace" font-weight="700" font-size="7.5" fill="#090a0f" text-anchor="middle">VITE</text>
                <circle cx="-34" cy="0" r="10" fill="#f97316"></circle>
                <text x="-34" y="3.5" font-family="Fira Code, monospace" font-weight="700" font-size="7.5" fill="#090a0f" text-anchor="middle">GIT</text>
              </g>
            </g>
          </g>
        </g>

        <!-- Right: Grouped Chip Grid -->
        <g transform="translate(550, 125)">
          <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f97316">Frontend &amp; Core Languages</text>
          <g transform="translate(0, 15)">
            <rect x="0" y="0" width="130" height="38" fill="#141724" rx="8" stroke="#f97316" stroke-width="1.2"></rect>
            <text x="65" y="24" font-family="Fira Code, monospace" font-size="13" fill="#fff" text-anchor="middle">React.js</text>
            <rect x="145" y="0" width="130" height="38" fill="#141724" rx="8" stroke="#22d3ee" stroke-width="1.2"></rect>
            <text x="210" y="24" font-family="Fira Code, monospace" font-size="13" fill="#fff" text-anchor="middle">JavaScript</text>
            <rect x="290" y="0" width="130" height="38" fill="#141724" rx="8" stroke="#a78bfa" stroke-width="1.2"></rect>
            <text x="355" y="24" font-family="Fira Code, monospace" font-size="13" fill="#fff" text-anchor="middle">HTML / CSS</text>
            <rect x="435" y="0" width="130" height="38" fill="#141724" rx="8" stroke="#f472b6" stroke-width="1.2"></rect>
            <text x="500" y="24" font-family="Fira Code, monospace" font-size="13" fill="#fff" text-anchor="middle">Tailwind</text>
          </g>

          <text x="0" y="95" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="#22d3ee">Build Tools &amp; Version Control (Orbiting Moons)</text>
          <g transform="translate(0, 110)">
            <rect x="0" y="0" width="130" height="38" fill="#141724" rx="8" stroke="#eab308" stroke-width="1.5"></rect>
            <text x="65" y="24" font-family="Fira Code, monospace" font-size="13" fill="#eab308" text-anchor="middle">⚡ Vite</text>
            <rect x="145" y="0" width="130" height="38" fill="#141724" rx="8" stroke="#f97316" stroke-width="1.5"></rect>
            <text x="210" y="24" font-family="Fira Code, monospace" font-size="13" fill="#f97316" text-anchor="middle">🌿 Git</text>
            <rect x="290" y="0" width="130" height="38" fill="#141724" rx="8" stroke="rgba(255,255,255,0.15)"></rect>
            <text x="355" y="24" font-family="Fira Code, monospace" font-size="13" fill="#fff" text-anchor="middle">GitHub</text>
            <rect x="435" y="0" width="130" height="38" fill="#141724" rx="8" stroke="rgba(255,255,255,0.15)"></rect>
            <text x="500" y="24" font-family="Fira Code, monospace" font-size="13" fill="#fff" text-anchor="middle">VS Code</text>
          </g>

          <text x="0" y="190" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" fill="#f472b6">Logic, Data &amp; Gaming Mindset</text>
          <g transform="translate(0, 205)">
            <rect x="0" y="0" width="150" height="38" fill="#141724" rx="8" stroke="rgba(244,114,182,0.4)"></rect>
            <text x="75" y="24" font-family="Fira Code, monospace" font-size="13" fill="#fff" text-anchor="middle">Algorithms</text>
            <rect x="165" y="0" width="160" height="38" fill="#141724" rx="8" stroke="rgba(244,114,182,0.4)"></rect>
            <text x="245" y="24" font-family="Fira Code, monospace" font-size="13" fill="#fff" text-anchor="middle">Problem Solving</text>
            <rect x="340" y="0" width="160" height="38" fill="#141724" rx="8" stroke="rgba(244,114,182,0.4)"></rect>
            <text x="420" y="24" font-family="Fira Code, monospace" font-size="13" fill="#fff" text-anchor="middle">Game Strategy</text>
          </g>
        </g>
      </svg>